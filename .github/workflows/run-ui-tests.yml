name: Run Playwright tests in Docker

on:
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack and install Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install

      - name: Run tests
        run: docker compose -f docker-compose.local.yml up --build --abort-on-container-exit

      - name: Generate Allure single-file report
        if: always()
        run: yarn allure:generate:single

      - name: Upload Allure single-file report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report.html
          path: ./allure-report/index.html